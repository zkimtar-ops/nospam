name: Safety_Call_Japan_Full_Package

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build and Sign Safety Call Japan
        run: |
          # 1. إعطاء صلاحيات التنفيذ للمحرك
          chmod +x gradlew

          # 2. قبول التراخيص
          yes | sdkmanager --licenses || true

          # 3. إنشاء مفتاح التوقيع (JKS) تلقائياً بنفس البيانات المطلوبة
          keytool -genkey -v \
            -keystore release.jks \
            -alias safety_key \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass 123456 \
            -keypass 123456 \
            -dname "CN=Zakaria, O=SafetyCallJapan, C=JP" \
            -deststoretype pkcs12

          # 4. بناء نسخة الـ APK الموقعة (Native Build) لضمان عمل خدمة الحظر
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/release.jks \
            -Pandroid.injected.signing.store.password=123456 \
            -Pandroid.injected.signing.key.alias=safety_key \
            -Pandroid.injected.signing.key.password=123456

          # 5. بناء نسخة الـ AAB (للمتجر)
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/release.jks \
            -Pandroid.injected.signing.store.password=123456 \
            -Pandroid.injected.signing.key.alias=safety_key \
            -Pandroid.injected.signing.key.password=123456

          # 6. تجميع المخرجات وتغيير أسمائها كما طلبت
          mkdir -p output
          cp app/build/outputs/apk/release/app-release.apk ./output/Safety_Call_V1.apk
          cp app/build/outputs/bundle/release/app-release.aab ./output/Safety_Call_V1.aab
          cp release.jks ./output/release.jks

      - name: Upload Full Package
        uses: actions/upload-artifact@v4
        with:
          name: SafeCall-Japan-Full-Package
          path: output/

