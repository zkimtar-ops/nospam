name: Build NoSpam Japan APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. جلب الكود الخاص بك من GitHub
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. إعداد الجافا (النسخة 17)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. إعداد أداة Gradle من الإنترنت مباشرة (بدون الحاجة لملفات محلية)
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2 # سيقوم السيرفر بتحميل هذه النسخة تلقائياً

      # 4. تشغيل عملية البناء باستخدام Gradle النظام
      # لاحظ أننا نستخدم "gradle" وليس "./gradlew"
      - name: Build with Gradle
        run: gradle assembleDebug

      # 5. رفع تطبيق الـ APK الناتج للتحميل
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoSpam-Japan-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
