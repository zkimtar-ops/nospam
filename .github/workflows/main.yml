name: Safety_Call_Japan_Final_V4

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Nuclear Clean and Build
        run: |
          # 1. تنظيف شامل للملفات المكسورة التي تسبب "Broken Pipe"
          rm -rf .gradle gradlew gradlew.bat gradle/
          
          # 2. توليد محرك Gradle جديد تماماً
          gradle wrapper --gradle-version 8.2.1
          chmod +x gradlew

          # 3. إعداد خصائص الذاكرة لمنع انهيار السيرفر (حل مشكلة PlanExecutor)
          echo "org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m" > gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          echo "org.gradle.daemon=false" >> gradle.properties

          # 4. إنشاء ملف JKS تلقائياً
          keytool -genkey -v -keystore release.jks -alias safety_key -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=Zakaria, O=SafetyCall" -deststoretype pkcs12

          # 5. البناء مع تجاهل الأخطاء غير القاتلة (Force Build)
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/release.jks \
            -Pandroid.injected.signing.store.password=123456 \
            -Pandroid.injected.signing.key.alias=safety_key \
            -Pandroid.injected.signing.key.password=123456 \
            --no-daemon --stacktrace

          # 6. تجميع المخرجات
          mkdir -p output
          cp app/build/outputs/apk/release/*.apk output/Safety_Call_Final.apk
          cp release.jks output/release.jks

      - name: Download Final APK
        uses: actions/upload-artifact@v4
        with:
          name: Final-Production-App
          path: output/
