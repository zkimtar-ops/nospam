name: Safety_Call_Japan_Complete_Bundle

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Fix Environment
        run: |
          # 1. إنشاء ملف الخصائص لتمكين AndroidX
          echo "android.useAndroidX=true" > gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          
          # 2. إنشاء ملف google-services وهمي لكي لا يفشل البناء (إذا لم يرفعه المستخدم)
          if [ ! -f "app/google-services.json" ]; then
            echo '{"project_info":{"project_number":"0","project_id":"temp"},"client":[{"client_info":{"mobilesdk_app_id":"1:0:android:0","android_client_info":{"package_name":"com.nospam.japan"}},"api_key":[{"current_key":"temp"}]}]}' > app/google-services.json
          fi

          # 3. إصلاح وتوليد ملف gradlew
          rm -f gradlew
          gradle wrapper --gradle-version 8.2
          chmod +x gradlew

          # 4. إنشاء مفتاح JKS (Alias: safety_key | Pass: 123456)
          keytool -genkey -v -keystore release.jks -alias safety_key -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=Zakaria, O=SafetyCallJapan" -deststoretype pkcs12

      - name: Build All Formats (APK & AAB)
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/release.jks \
            -Pandroid.injected.signing.store.password=123456 \
            -Pandroid.injected.signing.key.alias=safety_key \
            -Pandroid.injected.signing.key.password=123456

          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/release.jks \
            -Pandroid.injected.signing.store.password=123456 \
            -Pandroid.injected.signing.key.alias=safety_key \
            -Pandroid.injected.signing.key.password=123456

      - name: Prepare Final Artifacts
        run: |
          mkdir -p final_bundle
          cp app/build/outputs/apk/release/*.apk ./final_bundle/Safety_Call_Japan_V1.apk
          cp app/build/outputs/bundle/release/*.aab ./final_bundle/Safety_Call_Japan_V1.aab
          cp release.jks ./final_bundle/release_key_zakaria.jks

      - name: Upload Everything
        uses: actions/upload-artifact@v4
        with:
          name: Safety-Call-Full-Package-V1
          path: final_bundle/
