name: Safety_Call_Japan_Full_Package

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Android App
        run: |
          # 1. تثبيت كوردوفا
          npm install -g cordova --no-audit
          
          # 2. إنشاء هيكل مشروع كوردوفا إذا لم يكن موجوداً
          # هذا السطر يحل مشكلة "Not a Cordova-based project"
          if [ ! -f config.xml ]; then
            echo "إعداد هيكل مشروع كوردوفا الجديد..."
            cordova create safety_project com.nospam.japan "Safety Call Japan"
            cp -r safety_project/. .
            rm -rf safety_project
          fi

          # 3. التأكد من وجود مجلد www وملف الواجهة
          mkdir -p www
          if [ -f app/src/main/assets/index.html ]; then
            cp app/src/main/assets/index.html www/index.html
          else
            echo "<h1>Safety Call Japan</h1>" > www/index.html
          fi
          
          # 4. إضافة المنصة والإضافات
          cordova platform add android@13.0.0 --save
          cordova plugin add cordova-plugin-android-permissions --save
          cordova plugin add cordova-plugin-device --save
          
          # 5. تجهيز البيئة
          cordova prepare android
          
          # 6. إنشاء مفتاح التوقيع (release.jks)
          keytool -genkey -v -keystore release.jks -alias safety_key -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=Zakaria, O=SafetyCallJapan" -deststoretype pkcs12

          # 7. إعداد ملف البناء
          cat <<EOF > build.json
          {
              "android": {
                  "release": {
                      "keystore": "release.jks",
                      "storePassword": "123456",
                      "alias": "safety_key",
                      "password": "123456"
                  }
              }
          }
          EOF

          # 8. البناء النهائي
          cordova build android --release --buildConfig=build.json -- --packageType=apk
          cordova build android --release --buildConfig=build.json -- --packageType=bundle

          # 9. تجميع المخرجات
          mkdir -p output
          cp platforms/android/app/build/outputs/apk/release/*.apk ./output/Safety_Call_V1.apk
          cp platforms/android/app/build/outputs/bundle/release/*.aab ./output/Safety_Call_V1.aab
          cp release.jks ./output/release.jks

      - name: Upload Full Package
        uses: actions/upload-artifact@v4
        with:
          name: SafeCall-Japan-Full-Package
          path: output/
