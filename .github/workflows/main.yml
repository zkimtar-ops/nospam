name: Safety_Call_Japan_Final_V5

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Fix and Build
        run: |
          # 1. تنظيف شامل وتوليد ملفات تشغيل نظيفة
          rm -f gradlew gradlew.bat
          gradle wrapper --gradle-version 8.2
          chmod +x gradlew

          # 2. إعداد الذاكرة لمنع انهيار DefaultPlanExecutor
          echo "org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8" > gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

          # 3. توليد المفتاح تلقائياً
          keytool -genkey -v -keystore release.jks -alias safety_key -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=Zakaria, O=SafetyCall" -deststoretype pkcs12

          # 4. البناء النهائي APK
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/release.jks \
            -Pandroid.injected.signing.store.password=123456 \
            -Pandroid.injected.signing.key.alias=safety_key \
            -Pandroid.injected.signing.key.password=123456 --no-daemon

          # 5. تنظيم المخرجات
          mkdir -p output
          cp app/build/outputs/apk/release/*.apk output/Safety_Call_Final_V5.apk
          cp release.jks output/release_key.jks

      - name: Upload Final Package
        uses: actions/upload-artifact@v4
        with:
          name: Safety-Call-V5-Package
          path: output/
