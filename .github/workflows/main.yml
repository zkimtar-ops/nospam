name: Safety_Call_Japan_Full_Package

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Generate Clean Gradlew
        run: |
          # حذف أي ملف قديم مكسور وإنشاء واحد جديد ونظيف
          rm -f gradlew
          gradle wrapper --gradle-version 8.2
          chmod +x gradlew

      - name: Build and Sign App
        run: |
          # 1. إنشاء مفتاح التوقيع (JKS)
          keytool -genkey -v -keystore release.jks -alias safety_key -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=Zakaria, O=SafetyCallJapan" -deststoretype pkcs12

          # 2. بناء APK الموقّع باستخدام الملف الجديد
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/release.jks \
            -Pandroid.injected.signing.store.password=123456 \
            -Pandroid.injected.signing.key.alias=safety_key \
            -Pandroid.injected.signing.key.password=123456

          # 3. تنظيم المخرجات
          mkdir -p output
          cp app/build/outputs/apk/release/*.apk ./output/Safety_Call_V1.apk
          cp release.jks ./output/release.jks

      - name: Upload Package
        uses: actions/upload-artifact@v4
        with:
          name: SafeCall-Japan-V1
          path: output/
