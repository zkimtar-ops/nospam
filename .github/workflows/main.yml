name: Safety_Call_Final_Emergency_Fix

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create Missing Folders and Files
        run: |
          # إنشاء المجلدات إذا كانت مفقودة لضمان عدم فشل AAPT
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          
          # التأكد من وجود ملف strings.xml
          echo '<resources><string name="app_name">Safety Call Japan</string></resources>' > app/src/main/res/values/strings.xml

      - name: Build and Sign
        run: |
          rm -f gradlew
          gradle wrapper --gradle-version 8.2
          chmod +x gradlew

          # إنشاء المفتاح JKS
          keytool -genkey -v -keystore release.jks -alias safety_key -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=Zakaria" -deststoretype pkcs12

          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/release.jks \
            -Pandroid.injected.signing.store.password=123456 \
            -Pandroid.injected.signing.key.alias=safety_key \
            -Pandroid.injected.signing.key.password=123456 --no-daemon

          mkdir output
          cp app/build/outputs/apk/release/*.apk output/SafetyCall_Final.apk

      - name: Download APK
        uses: actions/upload-artifact@v4
        with:
          name: Safety-Call-Final-APK
          path: output/
