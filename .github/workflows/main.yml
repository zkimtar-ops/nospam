name: Safety_Call_Japan_Final_Fix_V3

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Build Everything From Scratch
        run: |
          # 1. تنظيف البيئة تماماً وإصلاح ملفات التشغيل
          rm -f gradlew gradlew.bat
          gradle wrapper --gradle-version 8.2
          chmod +x gradlew

          # 2. إعداد خصائص الأندرويد لضمان التوافق
          echo "android.useAndroidX=true" > gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx2048m" >> gradle.properties

          # 3. إنشاء مفتاح التوقيع (JKS) تلقائياً
          # Alias: safety_key | Pass: 123456
          keytool -genkey -v -keystore release.jks -alias safety_key -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=Zakaria, O=SafetyCallJapan" -deststoretype pkcs12

          # 4. بناء APK الموقّع
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/release.jks \
            -Pandroid.injected.signing.store.password=123456 \
            -Pandroid.injected.signing.key.alias=safety_key \
            -Pandroid.injected.signing.key.password=123456 --stacktrace

          # 5. بناء AAB الموقّع للمتجر
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/release.jks \
            -Pandroid.injected.signing.store.password=123456 \
            -Pandroid.injected.signing.key.alias=safety_key \
            -Pandroid.injected.signing.key.password=123456

          # 6. تجميع المخرجات النهائية
          mkdir -p final_package
          cp app/build/outputs/apk/release/*.apk ./final_package/Safety_Call_Japan_V3.apk
          cp app/build/outputs/bundle/release/*.aab ./final_package/Safety_Call_Japan_V3.aab
          cp release.jks ./final_package/release_key.jks

      - name: Upload Complete Package (APK + AAB + JKS)
        uses: actions/upload-artifact@v4
        with:
          name: Safety-Call-Full-Bundle-V3
          path: final_package/
