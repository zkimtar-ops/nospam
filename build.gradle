// تم تنظيف هذا الملف وحذف "allprojects" لحل مشكلة التعارض مع settings.gradle
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // محرك بناء أندرويد
        classpath 'com.android.tools.build:gradle:8.2.0'
        
        // تحديث كوتلن إلى 1.9.22 لإصلاح الأخطاء السابقة
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22"
        
        // خدمات جوجل
        classpath 'com.google.gms:google-services:4.4.0'
    }
}

// ملاحظة: لا تضف أي بلوك "repositories" أو "allprojects" هنا 
// لأنها معرفة الآن في ملف settings.gradle
tasks.register('clean', Delete) {
    delete rootProject.buildDir
}
