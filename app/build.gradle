plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    // تطبيق الإضافة فقط في حال وجود ملف الإعدادات
    id 'com.google.gms.google-services' apply false
}

android {
    namespace 'com.nospam.japan'
    compileSdk 34

    defaultConfig {
        applicationId "com.nospam.japan"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
        
        // تفعيل MultiDex للتعامل مع عدد كبير من المكتبات
        multiDexEnabled true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    // حل مشكلة تكرار الملفات التي تسبب فشل البناء
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
            excludes += 'META-INF/versions/9/previous-compilation-data.bin'
            excludes += '**/metadata/bitmaps.proto'
            excludes += '**/ads-adservices-java_release.kotlin_module'
        }
    }
}

// إجبار النظام على استخدام إصدارات متوافقة لمنع الـ Conflict
configurations.all {
    resolutionStrategy {
        force 'androidx.core:core-ktx:1.12.0'
        force 'androidx.appcompat:appcompat:1.6.1'
        force 'androidx.credentials:credentials:1.2.2'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.multidex:multidex:2.0.1'

    // Firebase (إصدار مستقر)
    implementation platform('com.google.firebase:firebase-bom:33.1.2')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-auth-ktx'
    implementation 'com.google.firebase:firebase-firestore-ktx'
}

// تشغيل Google Services فقط إذا كان الملف موجوداً
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}
