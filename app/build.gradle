plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    // تم إضافة الشرط لكي لا يفشل البناء إذا لم ترفع ملف google-services.json بعد
    id 'com.google.gms.google-services' apply false
}

// تفعيل الإضافة يدوياً مع التحقق من وجود الملف
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}

android {
    namespace 'com.nospam.japan'
    compileSdk 34

    defaultConfig {
        applicationId "com.nospam.japan"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
            excludes += 'META-INF/versions/9/previous-compilation-data.bin'
            // حل مشكلة ملفات البروتوكول المتكررة
            excludes += '**/metadata/bitmaps.proto'
        }
    }
}

// حل مشكلة التعارض (Dependency Resolution Strategy)
configurations.all {
    resolutionStrategy {
        force 'androidx.datastore:datastore-preferences:1.0.0'
        force 'androidx.datastore:datastore-core:1.0.0'
        force 'androidx.datastore:datastore-preferences-core:1.0.0'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Firebase BOM (الإصدار المستقر)
    implementation platform('com.google.firebase:firebase-bom:33.1.2')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-auth-ktx'
    implementation 'com.google.firebase:firebase-firestore-ktx'
}
